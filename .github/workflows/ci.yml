name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync locked dev environment
        run: uv sync --frozen --extra dev

      - name: Verify lockfile freshness
        run: uv lock --check

      - name: Verify formatting and lint (including Bandit security rules)
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run ruff check --select S src/

      - name: Strict static type checking
        run: uv run mypy --strict src tests

      - name: Full suite with >=85% branch coverage
        run: >
          uv run pytest --strict-markers -W error
          --cov=evalforge_maestro --cov-branch --cov-fail-under=85

      - name: Deterministic metrics 100% branch coverage
        run: >
          uv run pytest --strict-markers -W error
          --cov=evalforge_maestro.metrics --cov-branch --cov-fail-under=100
          tests/unit/test_metrics.py
          tests/unit/test_ir_metrics.py
          tests/unit/test_agent_metrics.py
          tests/contract/test_metric_formulas.py

      - name: QualityGate 100% branch coverage
        run: >
          uv run pytest --strict-markers -W error
          --cov=evalforge_maestro.regression.gate --cov-branch --cov-fail-under=100
          tests/unit/test_quality_gate.py

      - name: Mandatory release gate markers
        run: uv run pytest --strict-markers -W error -m "gate_determinism or gate_immutability"

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          uv export --frozen --no-emit-project --quiet -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict
          uv run pip-audit --skip-editable

      - name: Validate Conventional Commits
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run cz check --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            uv run cz check --rev-range "HEAD~1..HEAD"
          else
            git log -1 --pretty=%B > "$RUNNER_TEMP/commit_msg.txt"
            uv run cz check --commit-msg-file "$RUNNER_TEMP/commit_msg.txt"
          fi

  cross-os-and-packaging:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync and run full test suite across OS/Python matrix
        shell: bash
        run: |
          uv sync --frozen --extra dev
          uv run pytest --strict-markers -W error

      - name: Build and strictly validate wheel & sdist
        shell: bash
        run: |
          uv build
          uv run twine check --strict dist/*
          uv run python - <<'PY'
          import pathlib, tarfile, zipfile

          FORBIDDEN_NAMES = {"lean-toolchain", "lakefile.toml"}

          for whl in pathlib.Path("dist").glob("*.whl"):
              with zipfile.ZipFile(whl) as zf:
                  bad = [
                      n
                      for n in zf.namelist()
                      if (parts := pathlib.PurePosixPath(n).parts)
                      and ("formal" in parts or n.endswith(".lean") or parts[-1] in FORBIDDEN_NAMES)
                  ]
                  assert not bad, f"Unexpected Lean files in wheel {whl}: {bad}"

          for sdist in pathlib.Path("dist").glob("*.tar.gz"):
              with tarfile.open(sdist, "r:gz") as tf:
                  bad = [
                      m.name
                      for m in tf.getmembers()
                      if (parts := pathlib.PurePosixPath(m.name).parts)
                      and (
                          parts[0] == "formal"
                          or (len(parts) >= 2 and parts[1] == "formal")
                          or m.name.endswith(".lean")
                          or parts[-1] in FORBIDDEN_NAMES
                      )
                  ]
                  assert not bad, f"Unexpected Lean files in sdist {sdist}: {bad}"

          print("Verified zero Lean/formal files in wheel and sdist.")
          PY

      - name: Verify clean minimal wheel install (--no-dev)
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/clean-wheel-venv"
          uv venv "$RUNNER_TEMP/clean-wheel-venv" --python "${{ matrix.python-version }}"
          if [ -f "$RUNNER_TEMP/clean-wheel-venv/bin/python" ]; then
            VENV_PY="$RUNNER_TEMP/clean-wheel-venv/bin/python"
            VENV_CLI="$RUNNER_TEMP/clean-wheel-venv/bin/evalforge-maestro"
            VENV_CLI_ALT="$RUNNER_TEMP/clean-wheel-venv/bin/evalforge_maestro"
          else
            VENV_PY="$RUNNER_TEMP/clean-wheel-venv/Scripts/python.exe"
            VENV_CLI="$RUNNER_TEMP/clean-wheel-venv/Scripts/evalforge-maestro.exe"
            VENV_CLI_ALT="$RUNNER_TEMP/clean-wheel-venv/Scripts/evalforge_maestro.exe"
          fi
          uv pip install --python "$VENV_PY" dist/*.whl
          "$VENV_CLI" --version
          "$VENV_CLI" --help >/dev/null
          "$VENV_CLI_ALT" --help >/dev/null
          "$VENV_PY" - <<'PY'
          import sys
          import evalforge_maestro

          assert "docpipe_maestro" not in sys.modules
          assert "litellm" not in sys.modules
          assert "numpy" not in sys.modules
          assert "scipy" not in sys.modules
          assert "tomllib" not in sys.modules
          assert "tomli" not in sys.modules
          try:
              evalforge_maestro.DocpipeAdapter()
          except evalforge_maestro.MissingExtraError as exc:
              assert "docpipe-maestro" in str(exc)
          else:
              raise AssertionError("Expected MissingExtraError for docpipe-maestro")

          judge = evalforge_maestro.GroundednessMetric(
              config=evalforge_maestro.JudgeConfig(
                  model="openai/gpt-4o-mini", local_only=False, mock_mode=False
              )
          )
          case = evalforge_maestro.EvaluationCase(id="ci-1", input="SLA?", reference="99.9%")
          exec_res = evalforge_maestro.ExecutionResult(
              case_id="ci-1",
              input="SLA?",
              output="99.9%",
              retrieved_chunks=[evalforge_maestro.RetrievedChunk(id="c1", text="99.9%")],
              elapsed_seconds=0.0,
          )
          try:
              judge.evaluate(case, exec_res)
          except evalforge_maestro.MissingExtraError as exc:
              assert "judges" in str(exc)
          else:
              raise AssertionError("Expected MissingExtraError for judges")

          emb = evalforge_maestro.EmbeddingSimilarityMetric(
              config=evalforge_maestro.EmbeddingConfig(
                  model="mock-embedding", local_only=True, mock_mode=True
              )
          )
          try:
              emb.evaluate(case, exec_res)
          except evalforge_maestro.MissingExtraError as exc:
              assert "embeddings" in str(exc)
          else:
              raise AssertionError("Expected MissingExtraError for embeddings")
          PY
          "$VENV_CLI" run --config examples/ci/evalforge.toml --storage-dir "$RUNNER_TEMP/clean-wheel-store" --mock --local-only --strict --json >/dev/null

      - name: Verify clean sdist install on Linux
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/clean-sdist-venv" --python "${{ matrix.python-version }}"
          uv pip install --python "$RUNNER_TEMP/clean-sdist-venv/bin/python" dist/*.tar.gz
          "$RUNNER_TEMP/clean-sdist-venv/bin/evalforge-maestro" --version
          "$RUNNER_TEMP/clean-sdist-venv/bin/evalforge-maestro" --help >/dev/null
          "$RUNNER_TEMP/clean-sdist-venv/bin/python" - <<'PY'
          import sys
          import evalforge_maestro

          assert "docpipe_maestro" not in sys.modules
          assert "litellm" not in sys.modules
          assert "numpy" not in sys.modules
          assert "scipy" not in sys.modules
          PY

  optional-docpipe-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync with [docpipe-maestro] extra and verify lazy resolution & purity
        run: |
          uv sync --frozen --extra dev --extra docpipe-maestro
          uv run pytest --strict-markers -W error tests/test_library_purity.py
          uv run python -c "import sys, evalforge_maestro; assert 'docpipe_maestro' not in sys.modules; adapter = evalforge_maestro.DocpipeAdapter(mode='retrieve'); assert 'docpipe_maestro' in sys.modules"

  optional-judges-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync with [judges] extra and verify lazy resolution, air-gap safety & purity
        run: |
          uv sync --frozen --extra dev --extra judges
          uv run pytest --strict-markers -W error tests/test_library_purity.py tests/unit/test_judge_security.py
          uv run python - <<'PY'
          import os
          import socket
          import sys
          import evalforge_maestro
          from evalforge_maestro.judges.provider import _resolve_litellm

          assert "litellm" not in sys.modules

          def _blocked(*args, **kwargs):
              raise RuntimeError("Network forbidden during air-gap litellm import")

          socket.socket.connect = _blocked  # type: ignore[method-assign]
          socket.create_connection = _blocked  # type: ignore[assignment]
          mod = _resolve_litellm(local_only=True)
          assert os.environ.get("LITELLM_LOCAL_MODEL_COST_MAP") == "True"
          assert mod is not None and "litellm" in sys.modules
          PY
          uv run pip-audit

  optional-embeddings-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync with [embeddings] extra and verify lazy resolution, air-gap safety & purity
        run: |
          uv sync --frozen --extra dev --extra embeddings
          uv run pytest --strict-markers -W error tests/test_library_purity.py tests/unit/test_embedding_metrics.py tests/unit/test_embedding_provider.py tests/integration/test_statistical_embedding_pipeline.py
          uv run python - <<'PY'
          import os
          import socket
          import sys
          import evalforge_maestro
          from evalforge_maestro.embeddings.provider import resolve_litellm, resolve_numpy

          assert "numpy" not in sys.modules
          assert "scipy" not in sys.modules
          assert "litellm" not in sys.modules

          def _blocked(*args, **kwargs):
              raise RuntimeError("Network forbidden during air-gap litellm import")

          socket.socket.connect = _blocked  # type: ignore[method-assign]
          socket.create_connection = _blocked  # type: ignore[assignment]
          np_mod = resolve_numpy()
          litellm_mod = resolve_litellm(local_only=True)
          assert os.environ.get("LITELLM_LOCAL_MODEL_COST_MAP") == "True"
          assert np_mod is not None and "numpy" in sys.modules
          assert litellm_mod is not None and "litellm" in sys.modules
          PY
          uv run pip-audit

  formal-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Lean 4 formal specification, axiom audit, and run leanchecker
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "formal"
          build: "true"
          leanchecker: "true"
          leanchecker-args: "EvalForgeFormal"
          use-mathlib-cache: "false"

      - name: Verify Lean negative fault-detection probes (sorry & custom axiom rejection)
        run: bash formal/scripts/verify_negative_probes.sh

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync locked dev environment and run fail-closed live Lean conformance suite
        run: |
          uv sync --frozen --extra dev
          uv run pytest --strict-markers -W error --lean-live-oracle tests/conformance/
