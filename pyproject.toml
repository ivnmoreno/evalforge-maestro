[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "evalforge-maestro"
dynamic = ["version"]
description = "Independent LLM evaluation and regression verification engine"
readme = "README.md"
requires-python = ">=3.11.5"
license = "MIT"
keywords = [
    "llm-evaluation",
    "rag-evaluation",
    "information-retrieval",
    "regression-testing",
    "ai-quality-gates",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "jsonschema>=4.23,<5",
]

[project.scripts]
evalforge-maestro = "evalforge_maestro.cli:main"
evalforge_maestro = "evalforge_maestro.cli:main"

[project.urls]
Homepage = "https://github.com/ivnmoreno/evalforge-maestro"
Repository = "https://github.com/ivnmoreno/evalforge-maestro"
Issues = "https://github.com/ivnmoreno/evalforge-maestro/issues"

[project.optional-dependencies]
docpipe-maestro = [
    "docpipe-maestro>=0.5.0",
]
embeddings = [
    "litellm>=1.108.0",
    "numpy>=1.26,<3",
]
judges = [
    "litellm>=1.108.0",
]
dev = [
    "commitizen>=4.0",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "twine>=5.1",
    "types-jsonschema>=4.23",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge_maestro"]

[tool.hatch.build.targets.sdist]
exclude = ["/formal", "/agy-logs"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
filterwarnings = ["error"]
markers = [
    "gate_determinism: release gate verifying deterministic outputs across repeated runs",
    "gate_immutability: release gate verifying immutable run storage and dataset fingerprints",
]

[tool.coverage.run]
branch = true
source = ["src/evalforge_maestro"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "v$version"
