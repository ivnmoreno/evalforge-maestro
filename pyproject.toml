[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "evalforge-maestro"
dynamic = ["version"]
description = "Independent LLM evaluation and regression verification engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.7,<3",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "twine>=5.1",
    "types-jsonschema>=4.23",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge_maestro"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
filterwarnings = ["error"]
markers = [
    "gate_determinism: release gate verifying deterministic outputs across repeated runs",
    "gate_immutability: release gate verifying immutable run storage and dataset fingerprints",
]

[tool.coverage.run]
branch = true
source = ["src/evalforge_maestro"]

[tool.coverage.report]
fail_under = 85
show_missing = true
